<!doctype html>
<html lang="mk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страницата не е пронајдена · ЕУРОИНГ</title>
  <link rel="icon" href="favicons/favicon-32x32.png" sizes="32x32">
  <style>
    :root {
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(235, 127, 59, .18), transparent 34%), linear-gradient(145deg, #171127, #3a2f70);
      color: #fff
    }

    .card {
      width: min(760px, 100%);
      padding: clamp(36px, 7vw, 80px);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 28px;
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .25);
      backdrop-filter: blur(14px)
    }

    .code {
      display: block;
      color: #ffb400;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .24em
    }

    .logo {
      width: 142px;
      height: auto;
      margin-bottom: 48px
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.02;
      margin: 12px 0 20px
    }

    p {
      max-width: 580px;
      color: rgba(255, 255, 255, .74);
      font-size: 18px;
      line-height: 1.7
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px
    }

    a {
      display: inline-flex;
      padding: 14px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800
    }

    .primary {
      background: #eb7f3b;
      color: #fff
    }

    .secondary {
      border: 1px solid rgba(255, 255, 255, .3);
      color: #fff
    }

    a:focus-visible {
      outline: 3px solid #ffb400;
      outline-offset: 4px
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="images/logo.svg" alt="ЕУРОИНГ" width="142" height="60">
    <span class="code">ГРЕШКА 404</span>
    <h1>Страницата не е пронајдена.</h1>
    <p>Адресата можеби е променета или страницата повеќе не постои. Продолжете кон почетната страница или контактирајте
      нè.</p>
    <div class="actions"><a class="primary" href="index.html">Почетна</a><a class="secondary"
        href="contacts.html">Контакт</a></div>
  </main>
</body>

</html>
